name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly re-run so a dependency or toolchain change that breaks the build surfaces
  # even during a quiet stretch with no pushes. Keeping Supabase awake is a separate
  # concern, handled by keepalive.yml plus the Vercel cron in vercel.json.
  # (GitHub disables scheduled workflows after 60 days of repository inactivity.)
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The date helpers promise a rendered day that never shifts with the host's
      # timezone. The runner is UTC, where that promise is true by accident, so the
      # suite runs again under two awkward zones that each break a different way if
      # the UTC handling in lib/format.ts regresses. TZ is a no-op on Windows, so
      # this Linux job is the only place the guarantee is actually enforced.
      - name: Unit tests (UTC-11)
        run: npm test
        env:
          TZ: Pacific/Niue

      - name: Unit tests (UTC+14)
        run: npm test
        env:
          TZ: Pacific/Kiritimati
